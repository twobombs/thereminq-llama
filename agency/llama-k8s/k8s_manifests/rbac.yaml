apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-operator-clusterrole
rules:
- apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "describe", "update", "patch"] # AI should have broad read/edit
- apiGroups: [""]
  resources: ["pods/log", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"] # For Incident Responder to run diagnostic commands
- apiGroups: [""]
  resources: ["pods", "deployments", "statefulsets", "daemonsets", "services"]
  verbs: ["delete"] # Needed for restart/rollback if autonomously safe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-operator-clusterrolebinding
subjects:
- kind: ServiceAccount
  name: ai-operator-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ai-operator-clusterrole
  apiGroup: rbac.authorization.k8s.io
